; Modbus-Translator: GoodWe ET (Master) -> Lumel N43 (Slave) für ESP32-C6 und ESP32-C3
; Reines ESP-IDF-Projekt (ESP-IDF 5.5) über die pioarduino-Plattform.
; Chip-abhängige Werte (GPIOs, Standard-Pins) stehen in src/chip.h.
;
;   ESP32-C6 per USB:   pio run -e esp32-c6 -t upload
;   ESP32-C6 per WLAN:  pio run -e ota -t upload
;   ESP32-C3 per USB:   pio run -e esp32-c3 -t upload
;   ESP32-C3 per WLAN:  pio run -e ota-c3 -t upload

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
framework = espidf
board_build.flash_size = 4MB
; gleiche Aufteilung wie zuvor: NVS bleibt an derselben Stelle (Einstellungen bleiben erhalten)
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32-c6]
board = esp32-c6-devkitc-1

; Firmware per WLAN hochladen (Adresse ggf. anpassen, z.B. upload_port = 192.168.178.50)
[env:ota]
extends = env:esp32-c6
upload_protocol = custom
upload_port = modbus-bridge.local
upload_command = curl -sS -f --data-binary "@$SOURCE" -H "Content-Type: application/octet-stream" http://$UPLOAD_PORT/api/update

[env:esp32-c3]
board = esp32-c3-devkitm-1

[env:ota-c3]
extends = env:esp32-c3
upload_protocol = custom
upload_port = modbus-bridge.local
upload_command = curl -sS -f --data-binary "@$SOURCE" -H "Content-Type: application/octet-stream" http://$UPLOAD_PORT/api/update
