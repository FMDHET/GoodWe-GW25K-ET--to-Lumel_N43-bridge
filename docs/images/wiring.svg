<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="960" height="330" rx="16" fill="#0e1217"/>
  <!-- ESP -->
  <rect x="30" y="40" width="230" height="250" rx="14" fill="#1f6feb"/>
  <text x="145" y="74" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">ESP32-C6 / -C3</text>
  <g font-size="13" fill="#fff">
    <text x="50" y="118">RTU1 TX</text><text x="240" y="118" text-anchor="end">C6: 17 · C3: 20</text>
    <text x="50" y="146">RTU1 RX</text><text x="240" y="146" text-anchor="end">C6: 16 · C3: 21</text>
    <text x="50" y="174">RTU1 DE</text><text x="240" y="174" text-anchor="end">C6: 2 · C3: Auto</text>
    <text x="50" y="222">3V3</text>
    <text x="50" y="250">GND</text>
  </g>
  <!-- Modul -->
  <rect x="380" y="70" width="200" height="200" rx="14" fill="#171c23" stroke="#2f3a46"/>
  <text x="480" y="102" fill="#e5eaef" font-size="16" font-weight="700" text-anchor="middle">RS485-Modul</text>
  <g font-size="13" fill="#8f9bab">
    <text x="395" y="118">DI</text><text x="395" y="146">RO</text><text x="395" y="174">DE + /RE</text>
    <text x="395" y="222">VCC</text><text x="395" y="250">GND</text>
    <text x="565" y="146" text-anchor="end">A</text><text x="565" y="196" text-anchor="end">B</text>
  </g>
  <!-- Leitungen ESP-Modul -->
  <g stroke-width="2.5" fill="none">
    <path d="M260 113 H388" stroke="#f0b429"/>
    <path d="M260 141 H388" stroke="#3fb950"/>
    <path d="M260 169 H388" stroke="#a371f7" stroke-dasharray="6 4"/>
    <path d="M260 217 H388" stroke="#f47067"/>
    <path d="M260 245 H388" stroke="#8f9bab"/>
  </g>
  <!-- Bus -->
  <g stroke-width="3" fill="none">
    <path d="M580 141 H930" stroke="#4ea1ff"/>
    <path d="M580 191 H930" stroke="#e5eaef"/>
  </g>
  <text x="755" y="130" fill="#4ea1ff" font-size="14" text-anchor="middle">A (D+)</text>
  <text x="755" y="215" fill="#e5eaef" font-size="14" text-anchor="middle">B (D−)</text>
  <rect x="890" y="136" width="14" height="60" rx="3" fill="#2f3a46"/>
  <text x="897" y="240" fill="#8f9bab" font-size="12" text-anchor="middle">120 Ω</text>
  <text x="760" y="262" fill="#8f9bab" font-size="12" text-anchor="middle">zum GoodWe bzw. Lumel-Auswertegerät</text><text x="760" y="280" fill="#8f9bab" font-size="12" text-anchor="middle">GND mitführen</text>
  <text x="480" y="300" fill="#8f9bab" font-size="12" text-anchor="middle">Module mit Auto-Richtung: kein DE · in der Oberfläche „Auto“</text>
</svg>
